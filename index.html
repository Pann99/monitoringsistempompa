<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Sistem Pompa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e8eaed;
    --text: #1a1d23;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --accent: #2563eb;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --yellow: #d97706;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* HEADER — title only */
  header {
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:0 28px;
    height:56px;
    display:flex;
    align-items:center;
  }
  .logo {
    display:flex; align-items:center; gap:10px;
    font-weight:600; font-size:.95rem; color:var(--text);
  }
  .logo-icon { color:var(--accent); display:flex; }

  /* MAIN */
  main { max-width:1100px; margin:0 auto; padding:28px; }

  .section-title {
    font-size:.72rem; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--text-3); margin-bottom:12px;
  }

  /* METRIC CARDS */
  .metrics-row {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:28px;
  }
  .card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:20px;
    transition:box-shadow .2s;
  }
  .card:hover { box-shadow:0 2px 12px rgba(0,0,0,.06); }

  .metric-label {
    display:flex; align-items:center; gap:7px;
    font-size:.78rem; font-weight:500; color:var(--text-2); margin-bottom:10px;
  }
  .metric-icon {
    width:22px; height:22px; border-radius:6px;
    background:#eff6ff; display:flex; align-items:center;
    justify-content:center; font-size:12px; flex-shrink:0;
  }
  .metric-val {
    font-family:'DM Mono',monospace;
    font-size:2.1rem; font-weight:500; color:var(--text); line-height:1;
  }
  .metric-val .unit {
    font-size:.88rem; font-weight:400; color:var(--text-2); margin-left:3px;
  }
  .metric-sub { font-size:.72rem; color:var(--text-3); margin-top:7px; }

  /* Battery extras */
  .batt-row { display:flex; align-items:center; gap:10px; margin-top:9px; }
  .batt-track { flex:1; height:6px; background:#f3f4f6; border-radius:4px; overflow:hidden; }
  .batt-fill  { height:100%; border-radius:4px; background:var(--green); transition:width .8s ease; }
  .batt-pct   { font-family:'DM Mono',monospace; font-size:.78rem; color:var(--green); white-space:nowrap; }
  .badge {
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 10px; border-radius:20px;
    font-size:.7rem; font-weight:600; letter-spacing:.04em;
    margin-top:8px;
  }
  .badge.aman    { background:var(--green-bg); color:var(--green); border:1px solid var(--green-border); }
  .badge.waspada { background:#fffbeb; color:var(--yellow); border:1px solid #fde68a; }

  /* VALVE CARDS */
  .valve-row {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .valve-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:20px 20px 16px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    transition:box-shadow .2s;
  }
  .valve-card:hover { box-shadow:0 2px 12px rgba(0,0,0,.07); }
  .valve-card.open   { border-color:var(--green-border); background:var(--green-bg); }
  .valve-card.closed { border-color:var(--red-border);   background:var(--red-bg); }

  .valve-title { font-size:.85rem; font-weight:600; color:var(--text); align-self:flex-start; }
  .valve-art   { width:170px; height:116px; display:block; }

  .valve-footer { display:flex; flex-direction:column; align-items:center; gap:5px; width:100%; }
  .valve-state  { font-size:.75rem; color:var(--text-2); font-weight:500; }
  .valve-badge  {
    padding:5px 22px; border-radius:7px;
    font-size:.8rem; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase;
  }
  .valve-badge.open   { background:#dcfce7; color:var(--green); border:1.5px solid var(--green-border); }
  .valve-badge.closed { background:#fee2e2; color:var(--red);   border:1.5px solid var(--red-border); }

  /* Footer timestamp */
  .footer-ts {
    font-family:'DM Mono',monospace; font-size:.7rem;
    color:var(--text-3); text-align:right; margin-top:20px;
  }

  /* Fade-up entrance */
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .card, .valve-card { animation:fadeUp .4s ease both; }
  .metrics-row .card:nth-child(1){animation-delay:.04s}
  .metrics-row .card:nth-child(2){animation-delay:.08s}
  .metrics-row .card:nth-child(3){animation-delay:.12s}
  .metrics-row .card:nth-child(4){animation-delay:.16s}
  .valve-row .valve-card:nth-child(1){animation-delay:.22s}
  .valve-row .valve-card:nth-child(2){animation-delay:.28s}
  .valve-row .valve-card:nth-child(3){animation-delay:.34s}

  @media(max-width:960px)  { .metrics-row{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:600px)  { .metrics-row,.valve-row{grid-template-columns:1fr} main{padding:16px} }
</style>
</head>
<body>

<!-- HEADER: title only -->
<header>
  <div class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
    </div>
    Monitoring Sistem Pompa
  </div>
</header>

<main>

  <!-- METRIC CARDS -->
  <div class="section-title">Parameter Sensor</div>
  <div class="metrics-row">

    <div class="card">
      <div class="metric-label"><span class="metric-icon">⚡</span>Tegangan</div>
      <div class="metric-val" id="val-v">220.5<span class="unit">V</span></div>
      <div class="metric-sub">Nominal 220V AC</div>
    </div>

    <div class="card">
      <div class="metric-label"><span class="metric-icon">〰</span>Arus (Ipump)</div>
      <div class="metric-val" id="val-a">1.36<span class="unit">A</span></div>
      <div class="metric-sub">Sensor CT</div>
    </div>

    <div class="card">
      <div class="metric-label"><span class="metric-icon">⚙</span>Daya Pompa</div>
      <div class="metric-val" id="val-p">300<span class="unit">W</span></div>
      <div class="metric-sub">P = V × I</div>
    </div>

    <div class="card">
      <div class="metric-label"><span class="metric-icon">🔋</span>Tegangan Baterai</div>
      <div class="metric-val" id="val-bat">7.28<span class="unit">kWh</span></div>
      <div class="batt-row">
        <div class="batt-track"><div class="batt-fill" id="batt-fill" style="width:35%"></div></div>
        <div class="batt-pct" id="batt-pct">35%</div>
      </div>
      <div class="badge aman" id="batt-badge">● AMAN</div>
    </div>

  </div>

  <!-- VALVE CARDS -->
  <div class="section-title">Status Valve</div>
  <div class="valve-row">

    <div class="valve-card open" id="vc1">
      <div class="valve-title">Valve 1</div>
      <svg class="valve-art" id="vs1" viewBox="0 0 170 116" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="valve-footer">
        <div class="valve-state">Status Valve 1</div>
        <div class="valve-badge open" id="vb1">TERBUKA</div>
      </div>
    </div>

    <div class="valve-card closed" id="vc2">
      <div class="valve-title">Valve 2</div>
      <svg class="valve-art" id="vs2" viewBox="0 0 170 116" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="valve-footer">
        <div class="valve-state">Status Valve 2</div>
        <div class="valve-badge closed" id="vb2">TERTUTUP</div>
      </div>
    </div>

    <div class="valve-card closed" id="vc3">
      <div class="valve-title">Valve 3</div>
      <svg class="valve-art" id="vs3" viewBox="0 0 170 116" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="valve-footer">
        <div class="valve-state">Status Valve 3</div>
        <div class="valve-badge closed" id="vb3">TERTUTUP</div>
      </div>
    </div>

  </div>

  <div class="footer-ts" id="ts">—</div>
</main>

<script>
// ── SVG templates ────────────────────────────────────────
const PIPE = `
  <rect x="0"   y="55" width="50"  height="20" rx="3" fill="#c9cdd6"/>
  <rect x="1"   y="57" width="48"  height="16" rx="2" fill="#dde1e9"/>
  <rect x="2"   y="58" width="46"  height="5"  rx="1" fill="white" opacity=".45"/>
  <rect x="120" y="55" width="50"  height="20" rx="3" fill="#c9cdd6"/>
  <rect x="121" y="57" width="48"  height="16" rx="2" fill="#dde1e9"/>
  <rect x="122" y="58" width="46"  height="5"  rx="1" fill="white" opacity=".45"/>`;

const FLANGES = `
  <rect x="46"  y="51" width="8" height="28" rx="3" fill="#b0b8c8"/>
  <rect x="47"  y="53" width="6" height="24" rx="2" fill="#c9cdd6"/>
  <rect x="116" y="51" width="8" height="28" rx="3" fill="#b0b8c8"/>
  <rect x="117" y="53" width="6" height="24" rx="2" fill="#c9cdd6"/>`;

const BODY = `
  <rect x="52" y="40" width="66" height="50" rx="9" fill="#a0a8b8"/>
  <rect x="54" y="38" width="62" height="50" rx="8" fill="#d1d5df"/>
  <rect x="56" y="39" width="58" height="10" rx="6" fill="white" opacity=".3"/>
  <rect x="54" y="77" width="62" height="11" rx="0" fill="black" opacity=".05"/>`;

const STEM = `
  <rect x="81" y="12" width="8" height="28" rx="4" fill="#aab0c0"/>
  <rect x="82" y="13" width="6" height="26" rx="3" fill="#d1d5df"/>
  <rect x="82" y="13" width="6" height="6"  rx="3" fill="white" opacity=".3"/>
  <rect x="79" y="36" width="12" height="6" rx="3" fill="#b0b8c8"/>`;

function wheelSVG(ringColor) {
  return `<g transform="translate(85,13)">
    <circle r="16" fill="#b0b8c8" transform="translate(1,1)"/>
    <circle r="16" fill="none" stroke="#7a8398" stroke-width="3.5"/>
    <circle r="16" fill="none" stroke="#c9cdd6" stroke-width="1.5"/>
    <line x1="0"   y1="-16" x2="0"   y2="-6"  stroke="#8a93a8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0"   y1="6"   x2="0"   y2="16"  stroke="#8a93a8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-16" y1="0"   x2="-6"  y2="0"   stroke="#8a93a8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6"   y1="0"   x2="16"  y2="0"   stroke="#8a93a8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-11" y1="-11" x2="-5"  y2="-5"  stroke="#8a93a8" stroke-width="2"   stroke-linecap="round"/>
    <line x1="5"   y1="5"   x2="11"  y2="11"  stroke="#8a93a8" stroke-width="2"   stroke-linecap="round"/>
    <line x1="11"  y1="-11" x2="5"   y2="-5"  stroke="#8a93a8" stroke-width="2"   stroke-linecap="round"/>
    <line x1="-5"  y1="5"   x2="-11" y2="11"  stroke="#8a93a8" stroke-width="2"   stroke-linecap="round"/>
    <circle r="5.5" fill="#7a8398"/>
    <circle r="4"   fill="#aab0c0"/>
    <circle r="2"   fill="#d1d5df"/>
    <ellipse cx="-3" cy="-4" rx="3" ry="2" fill="white" opacity=".2" transform="rotate(-30)"/>
    <circle r="19" fill="none" stroke="${ringColor}" stroke-width="2" stroke-dasharray="4 3"/>
  </g>`;
}

function statusDot(color, label) {
  return `
    <circle cx="85" cy="100" r="5.5" fill="${color}"/>
    <circle cx="85" cy="100" r="9"   fill="none" stroke="${color}" stroke-width="1.5" opacity=".4"/>
    <text x="85" y="104" text-anchor="middle" fill="white" font-size="7" font-family="DM Sans" font-weight="700">${label}</text>`;
}

const BORE_OPEN = `
  <ellipse cx="85" cy="63" rx="13" ry="12" fill="#6b7280"/>
  <ellipse cx="85" cy="63" rx="11" ry="10" fill="#374151"/>
  <ellipse cx="85" cy="63" rx="8"  ry="7"  fill="#1f2937"/>
  <ellipse cx="85" cy="63" rx="5"  ry="4"  fill="#16a34a" opacity=".5"/>
  <g stroke="#16a34a" stroke-width="2" stroke-linecap="round" opacity=".85">
    <line x1="62" y1="63" x2="74" y2="63"/>
    <polyline points="71,59 75,63 71,67"/>
    <line x1="95" y1="63" x2="107" y2="63"/>
    <polyline points="96,59 92,63 96,67"/>
  </g>`;

const BORE_CLOSED = `
  <ellipse cx="85" cy="63" rx="14" ry="13" fill="#9ca3af"/>
  <ellipse cx="85" cy="63" rx="12" ry="11" fill="#ef4444"/>
  <ellipse cx="85" cy="60" rx="8"  ry="5"  fill="white" opacity=".18"/>
  <line x1="78" y1="56" x2="92" y2="70" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
  <line x1="92" y1="56" x2="78" y2="70" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>`;

function buildValveSVG(isOpen) {
  const c = isOpen ? '#16a34a' : '#ef4444';
  const lbl = isOpen ? 'ON' : 'OFF';
  return PIPE + FLANGES + BODY + (isOpen ? BORE_OPEN : BORE_CLOSED) + STEM + wheelSVG(c) + statusDot(c, lbl);
}

// ── Render valves ────────────────────────────────────────
function setValve(n, isOpen) {
  document.getElementById('vs'+n).innerHTML = buildValveSVG(isOpen);
  const vc = document.getElementById('vc'+n);
  const vb = document.getElementById('vb'+n);
  vc.className = 'valve-card ' + (isOpen ? 'open' : 'closed');
  vb.className = 'valve-badge ' + (isOpen ? 'open' : 'closed');
  vb.textContent = isOpen ? 'TERBUKA' : 'TERTUTUP';
}

// ── Update metric cards ──────────────────────────────────
function updateMetrics(d) {
  document.getElementById('val-v').innerHTML   = d.v.toFixed(1)   + '<span class="unit">V</span>';
  document.getElementById('val-a').innerHTML   = d.a.toFixed(2)   + '<span class="unit">A</span>';
  document.getElementById('val-p').innerHTML   = d.p.toFixed(0)   + '<span class="unit">W</span>';
  document.getElementById('val-bat').innerHTML = d.bat.toFixed(2) + '<span class="unit">kWh</span>';

  const pct = d.pct;
  document.getElementById('batt-fill').style.width = pct + '%';
  document.getElementById('batt-pct').textContent  = pct + '%';

  const bb = document.getElementById('batt-badge');
  if (pct >= 30) {
    bb.textContent = '● AMAN'; bb.className = 'badge aman';
    document.getElementById('batt-fill').style.background = '#16a34a';
  } else {
    bb.textContent = '● WASPADA'; bb.className = 'badge waspada';
    document.getElementById('batt-fill').style.background = '#d97706';
  }
}

// ── Dummy data simulation ────────────────────────────────
let eAcc = 5.8, bPct = 35;

function tick() {
  const v   = 218 + Math.random() * 6;
  const a   = 1.15 + Math.random() * 0.45;
  const p   = v * a;
  eAcc     += p / 3600000 * 3;
  bPct      = Math.max(5, Math.min(100, bPct + (Math.random() > .55 ? .4 : -.25)));

  const d = {
    v, a, p,
    bat: 7.0 + Math.random() * 0.5,
    pct: Math.round(bPct),
    valve: [true, false, false]   // ← diganti dari Firebase nanti
  };

  updateMetrics(d);
  d.valve.forEach((s, i) => setValve(i + 1, s));

  document.getElementById('ts').textContent =
    'Update: ' + new Date().toLocaleString('id-ID');
}

// Init
[1,2,3].forEach(n => setValve(n, n === 1));   // valve 1 open, 2&3 closed
tick();
setInterval(tick, 3000);

/*
── FIREBASE INTEGRATION ───────────────────────────────────
import { initializeApp } from "firebase/app";
import { getDatabase, ref, onValue } from "firebase/database";

const app = initializeApp({ ...firebaseConfig });
const db  = getDatabase(app);

onValue(ref(db, 'sensor'), snap => {
  const d = snap.val();
  // Struktur node Firebase dari ESP32:
  // { v, a, p, bat, pct, valve1, valve2, valve3 }
  updateMetrics(d);
  [1,2,3].forEach(n => setValve(n, d['valve'+n]));
});
───────────────────────────────────────────────────────────
*/
</script>
</body>
</html>
